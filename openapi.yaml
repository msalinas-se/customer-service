openapi: 3.0.3
info:
  title: Customer Service
  version: 1.0.0
servers:
  - url: http://localhost:8081
paths:
  /customers:
    get:
      summary: List customers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Bad request
  /customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get customer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Not found
    put:
      summary: Update customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Not found
    delete:
      summary: Delete customer
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
components:
  schemas:
    CustomerRequest:
      type: object
      required: [type, documentType, documentNumber, name]
      properties:
        type:
          type: string
          enum: [PERSONAL, BUSINESS]
        documentType:
          type: string
          enum: [DNI, CEX, PASSPORT, RUC]
        documentNumber:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
    Customer:
      allOf:
        - type: object
          properties:
            id:
              type: string
        - $ref: '#/components/schemas/CustomerRequest'
